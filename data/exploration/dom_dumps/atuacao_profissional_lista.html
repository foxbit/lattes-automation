function trim(str) {
  i=0;
  while (((str.substring(i,i+1))== " ")&&(i < str.length)) i++;
  aux=str.substring(i,str.length); i=aux.length;
  while (((aux.substring(i-1,i)) == " ")&&(i>1)) i--;
  aux=aux.substring(0,i);
  return aux;
}
function e_Num(valor){
  en=true; st="0123456789"; aux=trim(valor); ct=0;
  while (ct+1 <= aux.length) {
    if (st.indexOf(aux.substring(ct,ct+1))== -1) {
      en=false; break;
    }
    ct++;
  }
  return (en);
}
function check_data(valor) {
  vlraux = trim(valor);
  if ((vlraux == "") || (vlraux.length != 10) ||
     (vlraux.substring(2,3) != "/") ||(vlraux.substring(5,6)!= "/")){
     return false;
  }
  dia = parseInt(vlraux.substring(0,2),10); mes = parseInt(vlraux.substring(3,5),10);
  ano = parseInt(vlraux.substring(6,10),10);
  if (isNaN(dia) || isNaN(mes) || isNaN(ano) || (mes < 1) || (mes > 12) || (dia < 1)) {
    return false;
  }
  tabmes = "312831303130313130313031";
  if ((dia == 29) && (mes == 2)){
    if ((ano == 0) || ((ano % 4) != 0)){
      return false;
    } else {
  return true;
    }
  }
  k = (mes * 2 - 2)
  if (dia > tabmes.substring(k,k + 2)) {
    return false;
  } else {
    return true;
  }
 return false;
}
function checkcep(vlr){
  num="0123456789";
  if (vlr.length!=9) {
    return false;
  } else {
    for (i=0;i<8;i++){
      if ((i==5)&&((vlr.substring(i,i+1))!="-")){
        return false;
      } else if ((num.indexOf(vlr.substring(i,i+1))==-1)&&(i!=5)){
        return false;
      }
    }
  }
  return true;
}
function checkmail(vlr){
  if ((vlr.indexOf("@")==-1)||(vlr.indexOf(" ")!=-1)||(vlr.indexOf(",")!=-1)||(vlr.indexOf(";")!=-1)){
    return false;
  } else { return true;
  }
}

}

function alerta(err) {
  var cp;
  estilopadrao(cte_old);
  saida = "Não foi possível atualizar as informações porque ocorreram os seguintes problemas:\n\n<br><br>";
  for (i=0; i <= err-1; i++) {
    saida += msg[i] + "<br>";
    if (styleok) {
      nmecampo= obj[i].toUpperCase();
      if (nmecampo!="DC.F_AUTORES_PROD" && nmecampo!="DC.F_AUTORES_L" ) {
        cp=eval(obj[i]);
       // cp.style.backgroundColor="#FFFFDC";
       $(cp).addClass("input-error");
        if (i==0) {
           posicionarCampo(cp);
        }
      }
    }
  }

  cte_old = err;
  copiaArray (obj, obj_old);

// alert(saida);

    cp = eval(obj[0]);
    if(!cp.disabled){
         cp.focus();
    }
  }
  return;
}
function estilopadrao(e) {
  if (styleok) {
    for (i=0; i <= e-1; i++) {

      nmecampo= obj_old[i].toUpperCase();
      if (nmecampo!="DC.F_AUTORES_PROD") {
        cp=eval(obj_old[i]);
        $(cp).removeClass("input-error");
      //  cp.style.backgroundColor="#FFFFFF";
      }
    }
  }
  return;
}

function copiaArray(v1,v2){
  for (var i=0; i < v1.length; i++) {
    v2[i] = v1[i];
  }
  return;
}

// funcoes para fazer snapshot da pagina

function pegaValor(_nomeC){
   var vs="";
   ob=eval("dc."+ _nomeC);
   for (var ls=0; ls< ob.length; ls++) {
     if (ob[ls].checked) {
       vs=ob[ls].value;
     break;
    }
  }
    return vs;
}

function pegaTodosValores(_nome){
 vl="";
 obz=eval("dc." + _nome);
 for (var j=0; j< obz.length; j++) {
   vl+= obz[j].value;
 }
 return vl
}

function adicionaElemento (_nome, _tipo , _valor) {
  nomelc=_nome.toLowerCase();
  if (!((nomelc=="f_ctr")||(nomelc=="f_cod")||(nomelc=="f_seq")||
  (nomelc=="f_autores_l")||(nomelc=="f_setor_l")||(nomelc=="f_area_l")||(nomelc=="f_plv_l")||
  (nomelc=="f_autores_prod")||(nomelc=="f_setor_prod")||(nomelc=="f_area_prod")||(nomelc=="f_plv_prod") )) {
    ctA++;
    arNome[ctA]=_nome;
    arTipo[ctA]=_tipo;
    arValor[ctA]=_valor;
  } else if ((nomelc=="f_autores_prod")||(nomelc=="f_setor_prod")||(nomelc=="f_area_prod")||(nomelc=="f_plv_prod") ) {
    ctA++;
    arNome[ctA]= _nome;
    arTipo[ctA]=_tipo;
    arValor[ctA]= pegaTodosValores(_nome);
  }

}

function formSnapShot() {
  var saida="";
  var fim = dc.elements.length;

  for (var i=0; i < fim; i++) {
    nome=""; tipo=""; valor="";
    tipo=dc.elements[i].type;
    nome=dc.elements[i].name;

    if ( (tipo == "text") || (tipo == "hidden") || (tipo == "textarea") ) {
      valor=dc.elements[i].value;
      adicionaElemento(nome, tipo, valor);

    } else if (tipo == "select-one") {
      valor=dc.elements[i][dc.elements[i].selectedIndex].value;
      adicionaElemento(nome, tipo, valor);

    } else if ((tipo == "radio") || (tipo == "checkbox")) {
      valor=pegaValor(nome);
      adicionaElemento(nome, tipo, valor);
    }
  }


// for (var k=0; k<= ctA; k++){
//   saida+=arNome[k] + "  " + arTipo[k] + "  " + arValor[k] + "\n";
// }
 alert("snapshot campos do formulário : \n\n" + saida);

}

function formModificado(){
  var saida2 = "";
  mudou=false;
  for (var k=0; k<= ctA; k++){
    objm = eval("dc." + arNome[k]);
    objt = arTipo[k];
    if (!((objt == "radio") || (objt == "checkbox"))) {
      if ((arNome[k]=="f_autores_prod")||(arNome[k]=="f_setor_prod")||(arNome[k]=="f_area_prod")||(arNome[k]=="f_plv_prod")) {
        if ((pegaTodosValores(arNome[k]))!=arValor[k] ){
          mudou=true;
          saida2+= "2 campo " + arNome[k] + " foi modificado : " + pegaTodosValores(arNome[k]) + " \n-> " + arValor[k] + "\n\n";
          break;
        }
      } else if (objm.value != arValor[k]) {
          mudou=true;
          saida2+= "1 campo " + arNome[k] + " foi modificado : " + objm.value  + " \n-> " + arValor[k] + "\n\n";
          break;
      }
    } else if ((pegaValor(arNome[k]))!=arValor[k] ){
          mudou=true;
          saida2+= "3 campo " + arNome[k] + " foi modificado : " + pegaValor(arNome[k]) + " \n-> " + arValor[k] + "\n\n";
          break;
    }
  }
//  if (!mudou) saida2="os dados nao foram modificados.";
//  if (saida2!="") alert(saida2);
  return mudou;
}
